app = "chess-club-elo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "chessdata"
  destination = "/data"

[env]
  PORT = "8080"
  DATA_FILE = "/data/data.json"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
